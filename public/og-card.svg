  <rect width="1200" height="630" fill="#faf5f6"/>
  <!-- Inner frame -->
  <rect x="56" y="48" width="1088" height="534" rx="24" fill="none" stroke="#c23d53" stroke-opacity="0.35" stroke-width="3"/>
  <!-- Accent rule -->
  <rect x="96" y="120" width="96" height="6" rx="3" fill="#c23d53"/>
  <!-- Title -->
  <text x="96" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="600" fill="#1f2533">Tobi Stein</text>
  <text x="98" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#5a6172">Portfolio</text>
  <!-- Ink dot -->
  <circle cx="1048" cy="480" r="26" fill="#c23d53"/>
  <circle cx="1096" cy="480" r="10" fill="#c23d53" fill-opacity="0.45"/>
